spring.application.name=inventory-management-system
server.port=8080

# In-memory H2 database -- resets on every restart, zero setup required.
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:inventorydb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
